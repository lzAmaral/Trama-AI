name: Swift checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test persistence
        run: swift test
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
